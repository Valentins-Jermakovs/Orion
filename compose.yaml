services:

  # ==============================
  # Orion API
  # ==============================

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: orion-job-aggregator:local
    container_name: orion-api

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

    ports:
      - "127.0.0.1:8002:8002"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped
    init: true

    networks:
      - back_end


  # ==============================
  # Orion Worker
  # ==============================

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    image: orion-job-aggregator:local
    container_name: orion-worker

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

    command:
      - python
      - -m
      - app.worker

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped
    init: true

    networks:
      - back_end


  # ==============================
  # PostgreSQL 18
  # ==============================

  postgres:
    image: postgres:18-alpine
    container_name: orion-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orion_jobs}
      POSTGRES_USER: ${POSTGRES_USER:-orion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:55441:5432"

    volumes:
      - postgres18_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

    networks:
      - back_end


  # ==============================
  # Redis 8
  # ==============================

  redis:
    image: redis:8-alpine
    container_name: orion-redis

    ports:
      - "127.0.0.1:56381:6379"

    volumes:
      - redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    networks:
      - back_end


# ==============================
# Persistent volumes
# ==============================

volumes:
  postgres18_data:
  redis_data:


# ==============================
# Shared network
# ==============================

networks:
  back_end:
    external: true